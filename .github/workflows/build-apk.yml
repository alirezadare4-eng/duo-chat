name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../DuoChat.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoChat-APK
          path: DuoChat.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "نسخه اندروید چت دونفره DuoChat v1.0"
          body: |
            ❤️ فایل نصبی اندروید (APK) چت دونفره اختصاصی علیرضا و فاطمه
            
            ویژگی‌ها:
            - دیتابیس ابری ۲۴ ساعته (بدون نیاز به سیستم روشن)
            - نوتیفیکیشن آنلاین شدن و دریافت پیام
            - ضبط و ارسال پیام صوتی (ویس)
            - ارسال عکس و خاطرات مشترک
          files: DuoChat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
